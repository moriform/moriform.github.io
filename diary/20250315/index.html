    </header><h1 class="sr-only">2025 年 3 月 15 日的日记</h1>
    <div class="article__body prose"><p>凌晨的时候晚到了一个ai聊天的软件，然后发现了许多相关的软件，其中自定义最高的是sillytavern，相当于一个前端然后自己用各个平台的AI来生成文字。</p>
<p>试了一下deepseek和gemini的ai，效果还不错，最有趣的是某些内容需要一步一步引导ai去生成，去跨过ai自己的道德规束。</p>
<p>然后就玩入迷了。</p>
